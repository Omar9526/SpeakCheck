# Продакшн: Caddy (HTTPS) → Django/gunicorn, Celery-воркер, PostgreSQL, Redis.
# Запуск на сервере: cd deploy && cp .env.example .env && (заполнить) && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: speakcheck
      POSTGRES_USER: speakcheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speakcheck"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  web:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment: &backend-env
      DJANGO_ENV: production
      DJANGO_DEBUG: "0"
      DATABASE_URL: postgres://speakcheck:${POSTGRES_PASSWORD}@db:5432/speakcheck
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?задайте DOMAIN в deploy/.env}
      PUBLIC_BASE_URL: https://${DOMAIN}
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    volumes:
      - audio:/data/private
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    command: celery -A config worker --loglevel=INFO --concurrency=4
    volumes:
      - audio:/data/private
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]

volumes:
  pgdata:
  audio:
  caddy_data:
