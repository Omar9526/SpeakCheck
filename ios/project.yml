name: SpeakCheck
options:
  bundleIdPrefix: kg.speakcheck
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SpeakCheck:
    type: application
    platform: iOS
    sources:
      - SpeakCheck
    entitlements:
      path: SpeakCheck/Resources/SpeakCheck.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kg.speakcheck.app
        PRODUCT_NAME: SpeakCheck
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SpeakCheck/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SpeakCheck
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "SpeakCheck записывает ваше чтение вслух, чтобы оценить произношение."
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна, чтобы сфотографировать текст для чтения."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Доступ к фото нужен, чтобы распознать текст с изображения."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          SC_API_BASE_URL: "https://213-109-67-14.sslip.io"
        Release:
          SC_API_BASE_URL: "https://213-109-67-14.sslip.io"
  SpeakCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SpeakCheckTests
    dependencies:
      - target: SpeakCheck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: kg.speakcheck.app.tests
schemes:
  SpeakCheck:
    build:
      targets:
        SpeakCheck: all
        SpeakCheckTests: [test]
    test:
      targets:
        - SpeakCheckTests
