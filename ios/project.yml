name: SpeakCheck
options:
  bundleIdPrefix: kg.speakcheck
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
targets:
  SpeakCheck:
    type: application
    platform: iOS
    sources:
      - SpeakCheck
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: SpeakCheck/Resources/SpeakCheck.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kg.speakcheck.app
        PRODUCT_NAME: SpeakCheck
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SpeakCheck/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SpeakCheck
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "SpeakCheck записывает ваше чтение вслух, чтобы оценить произношение."
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна, чтобы сфотографировать текст для чтения."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Доступ к фото нужен, чтобы распознать текст с изображения."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        # Google Sign-In: iOS OAuth Client ID из Google Cloud Console (не секрет).
        # URL scheme — тот же ID задом наперёд: com.googleusercontent.apps.<число-хэш>
        SC_GOOGLE_CLIENT_ID: "98826537172-lu2ev5fbkrog220a346uvunsbuh3qh1u.apps.googleusercontent.com"
        SC_GOOGLE_URL_SCHEME: "com.googleusercontent.apps.98826537172-lu2ev5fbkrog220a346uvunsbuh3qh1u"
      configs:
        Debug:
          SC_API_BASE_URL: "https://213-109-67-14.sslip.io"
        Release:
          SC_API_BASE_URL: "https://213-109-67-14.sslip.io"
  SpeakCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SpeakCheckTests
    dependencies:
      - target: SpeakCheck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: kg.speakcheck.app.tests
schemes:
  SpeakCheck:
    build:
      targets:
        SpeakCheck: all
        SpeakCheckTests: [test]
    test:
      targets:
        - SpeakCheckTests
